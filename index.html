<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل گزارش تیم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f4;--sf:#fff;--ink:#14262e;--mut:#5d6f77;--ac:#1f3a93;--ac2:#e7ecfa;--ln:#d5dde1;--ok:#17724a;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1f;--sf:#17262d;--ink:#e6eef1;--mut:#93a6ae;--ac:#8fa8ff;--ac2:#1d2c55;--ln:#2a3d46;--ok:#58d19b;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0}h2{font-size:1.05rem;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:6px;padding:8px 16px}
@media(prefers-color-scheme:dark){button{color:#0f1a1f}}
button.s{background:transparent;color:var(--ac)}
button.sm{padding:3px 10px;font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border-color:var(--ln)}
.tabs button.on{background:var(--ac2);color:var(--ac);border-color:var(--ac);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}
.stat b{display:block;font-size:1.3rem;font-weight:800}.stat span{color:var(--mut);font-size:.82rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap;vertical-align:top}
th{color:var(--mut);font-weight:600}
.tag{background:var(--ac2);color:var(--ac);padding:1px 8px;border-radius:99px;font-size:.8rem}
.no{color:var(--bad)}.yes{color:var(--ok)}
.login{max-width:360px;margin:12vh auto}
.hint{color:var(--mut);font-size:.8rem}
.empty{color:var(--mut);padding:12px 0}
img.rc{max-width:100%;max-height:70vh;border-radius:6px}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);max-width:92vw}
.bz{position:fixed;top:env(safe-area-inset-top,0);left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:4px 16px;border-radius:0 0 8px 8px;font-size:.85rem;z-index:9}
.bz[hidden]{display:none}
</style>
</head>
<body>
<div class="bz" id="bz" hidden>در حال ارتباط…</div>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<script>
/* ====== تنظیم: شناسه bucket خود را در KVdb اینجا بگذارید ====== */
var BUCKET="PUT_YOUR_BUCKET_ID";
/* ================================================================ */

var TYPES=["کارشناسی","کاردانی","گواهینامه","دیپلم","ریز نمرات","سایر"];
var SEED=[{u:"Asnad90",p:"Asnad90",name:"مدیر",role:"admin",on:1},{u:"asheg1",p:"181890",name:"اشک",role:"m",on:1},{u:"mamag1",p:"181890",name:"ممگ",role:"m",on:1}];
var S={users:[],reqs:[],rcs:[],reps:[]},me=null,tab="",sel="",bn=0;

/* ---------- ارتباط با KVdb ---------- */
function url(k){return "https://kvdb.io/"+BUCKET+"/"+encodeURIComponent(k)}
async function kget(k){var r=await fetch(url(k),{cache:"no-store"});if(r.status==404)return null;if(!r.ok)throw new Error("get "+r.status);var t=await r.text();try{return JSON.parse(t)}catch(e){return null}}
async function kput(k,v){var r=await fetch(url(k),{method:"PUT",body:JSON.stringify(v)});if(!r.ok)throw new Error("put "+r.status)}
function busy(on){bn+=on?1:-1;$("bz").hidden=bn<=0}
function srt(a){return a.slice().sort(function(x,y){return y.id-x.id})}
function F(a,id){return a.filter(function(x){return x.id==id})[0]}
async function pull(u){var d=(await kget("d:"+u))||{};
 S.reqs=S.reqs.filter(function(x){return x.by!=u}).concat(d.r||[]);
 S.rcs=S.rcs.filter(function(x){return x.by!=u}).concat(d.c||[]);
 S.reps=S.reps.filter(function(x){return x.by!=u}).concat(d.p||[]);
 S.reqs=srt(S.reqs);S.rcs=srt(S.rcs)}
async function push(u){await kput("d:"+u,{r:S.reqs.filter(function(x){return x.by==u}),c:S.rcs.filter(function(x){return x.by==u}),p:S.reps.filter(function(x){return x.by==u})})}
async function pullAll(){if(me.role=="admin")await Promise.all(S.users.filter(function(u){return u.role=="m"}).map(function(u){return pull(u.u)}));else await pull(me.u)}
async function mut(u,fn){busy(1);try{await pull(u);fn();await push(u)}catch(e){alert("ارتباط با سرور برقرار نشد؛ دوباره تلاش کنید.")}busy(0);render()}
async function muU(fn){busy(1);try{S.users=(await kget("users"))||S.users;fn();await kput("users",S.users);me=S.users.filter(function(x){return x.u==me.u})[0]||me}catch(e){alert("ارتباط با سرور برقرار نشد؛ دوباره تلاش کنید.")}busy(0);render()}
async function putImg(id,img){if(img)await kput("i:"+id,img)}

/* ---------- ابزار ---------- */
function $(i){return document.getElementById(i)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fa(d){if(!d)return"—";try{return new Date(d+"T12:00:00").toLocaleDateString("fa-IR-u-ca-persian",{year:"numeric",month:"long",day:"numeric"})}catch(e){return d}}
function money(n){return Number(n||0).toLocaleString("fa-IR")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function name(u){var x=S.users.filter(function(a){return a.u==u})[0];return x?x.name:u}
function shrink(f,cb){if(!f){cb("");return}var im=new Image();im.onload=function(){var k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.65))};im.onerror=function(){cb("")};im.src=URL.createObjectURL(f)}

/* ---------- شروع، ورود، خروج ---------- */
async function boot(){
 if(!BUCKET||BUCKET.indexOf("PUT_")==0){$("app").innerHTML='<div class="card login"><h2>تنظیم اولیه</h2><p>شناسه bucket در ابتدای کد (متغیر BUCKET) وارد نشده است.</p></div>';return}
 $("app").innerHTML='<p class="empty">در حال بارگذاری…</p>';
 try{var u=await kget("users");if(!u){u=SEED;await kput("users",u)}S.users=u;
  var s=null;try{s=localStorage.getItem("asnad_u")}catch(e){}
  if(s){var x=u.filter(function(a){return a.u==s&&a.on})[0];if(x){me=x;tab=x.role=="admin"?"dash":"new";await pullAll()}}
 }catch(e){$("app").innerHTML='<div class="card login"><p class="no">اتصال به سرور برقرار نشد.</p><button onclick="boot()">تلاش دوباره</button></div>';return}
 render()}
async function login(){var u=$("lu").value.trim().toLowerCase(),p=$("lp").value;
 var x=S.users.filter(function(a){return a.u.toLowerCase()==u&&a.p==p&&a.on})[0];
 if(!x){$("le").textContent="نام کاربری یا رمز اشتباه است.";return}
 me=x;tab=x.role=="admin"?"dash":"new";try{localStorage.setItem("asnad_u",x.u)}catch(e){}
 busy(1);try{await pullAll()}catch(e){alert("ارتباط با سرور برقرار نشد.")}busy(0);render()}
function logout(){me=null;sel="";try{localStorage.removeItem("asnad_u")}catch(e){}render()}
async function refreshNow(){busy(1);try{var u=await kget("users");if(u)S.users=u;await pullAll()}catch(e){alert("ارتباط با سرور برقرار نشد.")}busy(0);render()}
async function refresh(){if(!me||document.hidden||bn>0)return;var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if($("dlg").open)return;
 if(me.role!="admin"&&["new","rc","rep"].indexOf(tab)>=0)return;if(me.role=="admin"&&tab=="team")return;
 try{var u=await kget("users");if(u){S.users=u;var x=u.filter(function(a){return a.u==me.u&&a.on})[0];if(!x){logout();return}me=x}await pullAll();render()}catch(e){}}
setInterval(refresh,20000);document.addEventListener("visibilitychange",refresh);

/* ---------- نمایش ---------- */
function render(){var a=$("app");
 if(!me){a.innerHTML='<div class="card login"><h1>ورود به پنل</h1><label>نام کاربری</label><input id="lu" autocomplete="username" autocapitalize="off"><label>رمز عبور</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==\'Enter\')login()"><div style="margin-top:14px"><button onclick="login()">ورود</button></div><p id="le" class="no"></p></div>';return}
 a.innerHTML='<div class="top"><h1>'+(me.role=="admin"?"پنل مدیریت":"پنل منشی")+' — '+esc(me.name)+'</h1><div class="row"><button class="s sm" onclick="refreshNow()">تازه‌سازی</button><button class="s sm" onclick="chpw()">تغییر رمز</button><button class="s sm" onclick="logout()">خروج</button></div></div>'+(me.role=="admin"?adminH():memberH())}
function tb(k,l){return '<button class="'+(tab==k?"on":"")+'" onclick="tab=\''+k+'\';leave();render()">'+l+'</button>'}
function leave(){if(sel){var u=sel;sel="";mut(u,function(){S.reqs.forEach(function(r){if(r.by==u)r.seen=1})})}}
function chpw(){var p=prompt("رمز جدید:");if(p&&p.length>=4){muU(function(){S.users.filter(function(a){return a.u==me.u})[0].p=p}).then(function(){alert("رمز تغییر کرد.")})}else if(p)alert("رمز باید حداقل ۴ کاراکتر باشد.")}
function stH(s){return s=="ok"?'<span class="yes">تایید شد ✓</span>':s=="no"?'<span class="no">رد شد</span>':'<span class="tag">در انتظار تایید</span>'}
function imgBtn(k){return k?'<button class="sm s" onclick="showImg('+k+')">مشاهده</button>':'—'}
async function showImg(k){var d=$("dlg"),cl='<div style="margin-top:10px"><button onclick="$(\'dlg\').close()">بستن</button></div>';d.innerHTML='<p>در حال بارگذاری…</p>';d.showModal();
 try{var s=await kget("i:"+k);d.innerHTML=s?'<img class="rc" src="'+s+'" alt="رسید">'+cl:'<p>تصویر پیدا نشد.</p>'+cl}catch(e){d.innerHTML='<p>خطا در دریافت تصویر.</p>'+cl}}

/* ---------- منشی ---------- */
function memberH(){var t=tab||"new";var h=nfH()+'<div class="tabs">'+tb("new","ثبت متقاضی")+tb("mine","درخواست‌های من")+tb("rc","رسیدها")+tb("rep","گزارش روزانه")+'</div>';
 if(t=="new")h+=formH();else if(t=="mine")h+=listH(S.reqs.filter(function(r){return r.by==me.u}),false);else if(t=="rc")h+=rcH();else h+=repH();return h}
function nfH(){var L=S.reqs.filter(function(r){return r.by==me.u&&r.nf&&!r.nseen});if(!L.length)return"";
 return '<div class="card" style="border-color:var(--ok)"><h2>مدارک ارسال شد</h2>'+L.map(function(r){return '<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)"><div>مدارک <b>'+esc(r.name)+'</b> ('+esc(r.type)+') در تاریخ '+fa(r.ship)+' ارسال شد.'+(r.track?'<br><span class="hint">کد رهگیری: '+esc(r.track)+'</span>':'')+'</div><button class="sm" onclick="nfOk('+r.id+')">متوجه شدم</button></div>'}).join("")+'</div>'}
function nfOk(id){mut(me.u,function(){F(S.reqs,id).nseen=1})}
function formH(){return '<div class="card"><h2>ثبت درخواست متقاضی</h2><div class="g"><div><label>نام متقاضی</label><input id="fn"></div><div><label>تلفن</label><input id="fp" inputmode="tel"></div><div><label>نوع درخواست</label><select id="ft">'+TYPES.map(function(t){return'<option>'+t+'</option>'}).join("")+'</select></div><div><label>مبلغ بیعانه (تومان)</label><input id="fa" type="number" min="0"></div><div><label>تاریخ مراجعه متقاضی</label><input id="fv" type="date" min="'+today()+'"></div><div><label>رسید بیعانه (تصویر)</label><input id="fr" type="file" accept="image/*"></div></div><label>آدرس برای ارسال مرسوله</label><textarea id="fad" rows="2"></textarea><label>کد پستی</label><input id="fz" inputmode="numeric"><label>پیام برای مدیر (اختیاری)</label><textarea id="fd" rows="2" placeholder="اگر چیزی هست که باید به مدیر برسد اینجا بنویسید"></textarea><div style="margin-top:14px"><button onclick="addReq()">ثبت درخواست</button></div></div>'}
function addReq(){var n=$("fn").value.trim();if(!n){alert("نام متقاضی را وارد کنید.");return}
 var id=Date.now(),r={id:id,st:"w",by:me.u,date:today(),name:n,phone:$("fp").value,type:$("ft").value,adv:+$("fa").value||0,visit:$("fv").value,note:$("fd").value,addr:$("fad").value.trim(),zip:$("fz").value.trim(),ik:0},f=$("fr").files[0];
 busy(1);shrink(f,function(img){(async function(){try{if(img){await putImg(id,img);r.ik=id}await pull(me.u);S.reqs.unshift(r);
  if(r.adv>0)S.rcs.unshift({id:id+1,by:me.u,amt:r.adv,date:today(),note:"بیعانه: "+r.name+" ("+r.type+")",ik:r.ik,st:"p",at:""});
  await push(me.u);tab="mine"}catch(e){alert("ثبت انجام نشد؛ ارتباط با سرور یا حجم تصویر را بررسی کنید.")}busy(0);render()})()})}
function stSel(r){var o={w:"در انتظار مراجعه",v:"مراجعه کرد",d:"تکمیل شده",c:"لغو شد"};return '<select style="min-width:130px" onchange="setSt(\''+r.by+'\','+r.id+',this.value)">'+Object.keys(o).map(function(k){return '<option value="'+k+'"'+((r.st||"w")==k?" selected":"")+'>'+o[k]+'</option>'}).join("")+'</select>'}
function setSt(u,id,v){mut(u,function(){F(S.reqs,id).st=v})}
function listH(L,adm,hs){var h='<div class="card"><h2>درخواست‌ها ('+L.length.toLocaleString("fa-IR")+')</h2>';
 if(!L.length)return h+'<div class="empty">هنوز درخواستی ثبت نشده است.</div></div>';
 h+='<div class="tw"><table><tr><th>تاریخ ثبت</th>'+(adm&&!hs?'<th>منشی</th>':'')+'<th>متقاضی</th><th>نوع</th><th>بیعانه</th><th>مراجعه</th><th>رسید</th><th>وضعیت</th><th>پیام و پاسخ</th><th></th></tr>';
 srt(L).forEach(function(r){h+='<tr><td>'+fa(r.date)+'</td>'+(adm&&!hs?'<td>'+esc(name(r.by))+'</td>':'')+'<td>'+esc(r.name)+(r.phone?'<br><span class="hint">'+esc(r.phone)+'</span>':'')+'</td><td><span class="tag">'+esc(r.type)+'</span></td><td>'+money(r.adv)+'</td><td>'+fa(r.visit)+'</td><td>'+(r.ik?imgBtn(r.ik):'<span class="no">ندارد</span>')+'</td><td>'+stSel(r)+(r.ship?'<div class="yes">مرسوله ارسال شد'+(r.track?' — رهگیری: '+esc(r.track):'')+'</div>':'')+'</td><td style="white-space:normal;min-width:190px">'+(r.note?(adm&&!r.seen?'<span class="tag no">جدید</span> ':'')+esc(r.note):'—')+(r.reply?'<div class="yes">پاسخ مدیر: '+esc(r.reply)+'</div>':'')+(adm?'<div><button class="sm s" onclick="rep(\''+r.by+'\','+r.id+')">'+(r.reply?'ویرایش پاسخ':'پاسخ')+'</button></div>':'')+'</td><td><button class="sm s" onclick="delReq(\''+r.by+'\','+r.id+')">حذف</button></td></tr>'});
 return h+'</table></div></div>'}
function delReq(u,id){if(confirm("این درخواست حذف شود؟"))mut(u,function(){S.reqs=S.reqs.filter(function(x){return x.id!=id})})}
function rep(u,id){var r=F(S.reqs,id),t=prompt("پاسخ شما به منشی:",r.reply||"");if(t!==null)mut(u,function(){F(S.reqs,id).reply=t.trim()})}

/* رسیدها */
function rcH(){var L=S.rcs.filter(function(r){return r.by==me.u});
 var h='<div class="card"><h2>ثبت رسید</h2><div class="g"><div><label>مبلغ رسید (تومان)</label><input id="ra" type="number" min="0"></div><div><label>تاریخ رسید</label><input id="rd" type="date" value="'+today()+'"></div><div><label>تصویر رسید</label><input id="ri" type="file" accept="image/*"></div></div><label>توضیح (اختیاری، مثلاً نام متقاضی)</label><input id="rn2"><div style="margin-top:14px"><button onclick="addRc()">ثبت رسید</button></div></div><div class="card"><h2>رسیدهای من</h2>';
 if(!L.length)return h+'<div class="empty">هنوز رسیدی ثبت نشده است.</div></div>';
 return h+'<div class="tw"><table><tr><th>تاریخ رسید</th><th>مبلغ</th><th>توضیح</th><th>تصویر</th><th>وضعیت</th></tr>'+srt(L).map(function(r){return '<tr><td>'+fa(r.date)+'</td><td>'+money(r.amt)+'</td><td style="white-space:normal">'+esc(r.note)+'</td><td>'+imgBtn(r.ik)+'</td><td>'+stH(r.st)+(r.why?'<div class="hint">دلیل: '+esc(r.why)+'</div>':'')+'</td></tr>'}).join("")+'</table></div></div>'}
function addRc(){var a=+$("ra").value,d=$("rd").value;if(!a||!d){alert("مبلغ و تاریخ رسید لازم است.");return}
 var id=Date.now(),r={id:id,by:me.u,amt:a,date:d,note:$("rn2").value,ik:0,st:"p",at:""},f=$("ri").files[0];
 busy(1);shrink(f,function(img){(async function(){try{if(img){await putImg(id,img);r.ik=id}await pull(me.u);S.rcs.unshift(r);await push(me.u)}catch(e){alert("ثبت انجام نشد؛ ارتباط با سرور یا حجم تصویر را بررسی کنید.")}busy(0);render()})()})}

/* گزارش روزانه */
function repH(){var r=S.reps.filter(function(x){return x.by==me.u&&x.date==today()})[0]||{};
 return '<div class="card"><h2>گزارش امروز — '+fa(today())+'</h2><div class="g"><div><label>فروش امروز (تومان)</label><input id="rs" type="number" value="'+(r.sale||"")+'"></div><div><label>فروش هدف فردا (تومان)</label><input id="rt" type="number" value="'+(r.target||"")+'"></div></div><label>برنامه فردا</label><textarea id="rp" rows="3">'+esc(r.plan||"")+'</textarea><div style="margin-top:14px"><button onclick="saveRep()">ذخیره گزارش</button></div></div>'}
function saveRep(){var o={by:me.u,date:today(),sale:+$("rs").value||0,target:+$("rt").value||0,plan:$("rp").value};
 mut(me.u,function(){S.reps=S.reps.filter(function(x){return!(x.by==o.by&&x.date==o.date)});S.reps.push(o)}).then(function(){alert("گزارش ذخیره شد.")})}

/* ---------- مدیر ---------- */
function nb(){var n=S.reqs.filter(function(r){return r.note&&!r.seen}).length;return n?" ("+n.toLocaleString("fa-IR")+" پیام جدید)":""}
function rn(){var n=S.rcs.filter(function(r){return r.st=="p"}).length;return n?" ("+n.toLocaleString("fa-IR")+" در انتظار)":""}
function sn(){var n=S.reqs.filter(function(r){return r.st=="d"&&!r.ship}).length;return n?" ("+n.toLocaleString("fa-IR")+")":""}
function adminH(){var t=tab||"dash";return '<div class="tabs">'+tb("dash","داشبورد")+tb("sec","منشی‌ها"+nb())+tb("all","همه درخواست‌ها")+tb("rcv","تایید رسیدها"+rn())+tb("ship","ارسال مرسوله"+sn())+tb("reps","گزارش‌های روزانه")+tb("team","مدیریت تیم")+'</div>'+(t=="dash"?dashH():t=="sec"?secH():t=="rcv"?rcvH():t=="ship"?shipH():t=="all"?allH():t=="reps"?repsH():teamH())}
function dashH(){var td=today(),ms=S.users.filter(function(u){return u.role=="m"&&u.on});
 var tr=S.reqs.filter(function(r){return r.date==td}),tr2=S.reps.filter(function(r){return r.date==td});
 var sale=tr2.reduce(function(a,b){return a+b.sale},0),adv=tr.reduce(function(a,b){return a+b.adv},0);
 var miss=ms.filter(function(u){return!tr2.some(function(r){return r.by==u.u})});
 var up=S.reqs.filter(function(r){return r.visit&&r.visit>=td&&(!r.st||r.st=="w")}).sort(function(a,b){return a.visit<b.visit?-1:1});
 var h='<div class="stats"><div class="stat"><b>'+money(tr.length)+'</b><span>متقاضی جدید امروز</span></div><div class="stat"><b>'+money(sale)+'</b><span>فروش امروز (تومان)</span></div><div class="stat"><b>'+money(adv)+'</b><span>بیعانه امروز (تومان)</span></div><div class="stat"><b>'+money(up.length)+'</b><span>مراجعه‌های پیش‌رو</span></div><div class="stat"><b>'+money(S.rcs.filter(function(r){return r.st=="p"}).length)+'</b><span>رسید منتظر تایید</span></div></div>';
 h+='<div class="card"><h2>گزارش امروز را نداده‌اند</h2>'+(miss.length?miss.map(function(u){return'<span class="tag no">'+esc(u.name)+'</span> '}).join(""):'<span class="yes">همه گزارش داده‌اند.</span>')+'</div>';
 h+='<div class="card"><h2>مراجعه‌های پیش‌رو</h2>'+(up.length?'<div class="tw"><table><tr><th>تاریخ مراجعه</th><th>متقاضی</th><th>نوع</th><th>منشی</th></tr>'+up.map(function(r){return'<tr><td>'+fa(r.visit)+(r.visit==td?' <span class="tag no">امروز</span>':'')+'</td><td>'+esc(r.name)+'</td><td><span class="tag">'+esc(r.type)+'</span></td><td>'+esc(name(r.by))+'</td></tr>'}).join("")+'</table></div>':'<div class="empty">مراجعه‌ای ثبت نشده است.</div>')+'</div>';return h}
function secH(){
 if(!sel){return '<div class="card"><h2>منشی‌ها</h2>'+S.users.filter(function(u){return u.role=="m"}).map(function(u){var L=S.reqs.filter(function(r){return r.by==u.u}),n=L.filter(function(r){return r.note&&!r.seen}).length;return '<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)"><div><b>'+esc(u.name)+'</b><br><span class="hint">'+money(L.length)+' درخواست'+(n?' — <span class="no">'+money(n)+' پیام جدید</span>':'')+'</span></div><button class="sm" onclick="sel=\''+u.u+'\';render()">مشاهده متقاضی‌ها</button></div>'}).join("")+'</div>'}
 return '<div class="row" style="margin-bottom:12px"><button class="s sm" onclick="leave();render()">بازگشت</button><h2 style="margin:0">متقاضی‌های '+esc(name(sel))+'</h2></div>'+listH(S.reqs.filter(function(r){return r.by==sel}),true,true)}
function allH(){var f=window.fm||"",ft=window.ftp||"";
 var L=S.reqs.filter(function(r){return(!f||r.by==f)&&(!ft||r.type==ft)});
 return '<div class="card"><div class="g"><div><label>منشی</label><select onchange="fm=this.value;render()"><option value="">همه</option>'+S.users.filter(function(u){return u.role=="m"}).map(function(u){return'<option value="'+u.u+'"'+(f==u.u?" selected":"")+'>'+esc(u.name)+'</option>'}).join("")+'</select></div><div><label>نوع درخواست</label><select onchange="ftp=this.value;render()"><option value="">همه</option>'+TYPES.map(function(t){return'<option'+(ft==t?" selected":"")+'>'+t+'</option>'}).join("")+'</select></div></div></div>'+listH(L,true)}
function rcvH(){var P=S.rcs.filter(function(r){return r.st=="p"}),D=S.rcs.filter(function(r){return r.st!="p"}),tot=D.filter(function(r){return r.st=="ok"}).reduce(function(a,b){return a+b.amt},0);
 var h='<div class="stats"><div class="stat"><b>'+money(P.length)+'</b><span>رسید در انتظار تایید</span></div><div class="stat"><b>'+money(tot)+'</b><span>جمع مبالغ تاییدشده (تومان)</span></div></div><div class="card"><h2>در انتظار تایید</h2>';
 if(!P.length)h+='<div class="empty">رسید جدیدی نیست.</div>';
 else h+='<div class="tw"><table><tr><th>منشی</th><th>تاریخ رسید</th><th>مبلغ</th><th>توضیح</th><th>تصویر</th><th></th></tr>'+P.map(function(r){return '<tr><td>'+esc(name(r.by))+'</td><td>'+fa(r.date)+'</td><td><b>'+money(r.amt)+'</b></td><td style="white-space:normal">'+esc(r.note)+'</td><td>'+imgBtn(r.ik)+'</td><td><button class="sm" onclick="decRc(\''+r.by+'\','+r.id+',\'ok\')">تایید — مبلغ نشسته</button> <button class="sm s" onclick="decRc(\''+r.by+'\','+r.id+',\'no\')">رد</button></td></tr>'}).join("")+'</table></div>';
 h+='</div>';
 if(D.length)h+='<div class="card"><h2>بررسی‌شده</h2><div class="tw"><table><tr><th>منشی</th><th>تاریخ رسید</th><th>مبلغ</th><th>وضعیت</th><th>تاریخ بررسی</th><th>تصویر</th></tr>'+D.map(function(r){return '<tr><td>'+esc(name(r.by))+'</td><td>'+fa(r.date)+'</td><td>'+money(r.amt)+'</td><td>'+stH(r.st)+(r.why?'<div class="hint">'+esc(r.why)+'</div>':'')+'</td><td>'+fa(r.at)+'</td><td>'+imgBtn(r.ik)+'</td></tr>'}).join("")+'</table></div></div>';
 return h}
function decRc(u,id,s){var w="";if(s=="no"){w=prompt("دلیل رد رسید (اختیاری):");if(w===null)return}mut(u,function(){var r=F(S.rcs,id);r.st=s;r.why=w;r.at=today()})}
function shipH(){var P=S.reqs.filter(function(r){return r.st=="d"&&!r.ship}),D=S.reqs.filter(function(r){return r.ship});
 var h='<div class="card"><h2>آماده ارسال (تکمیل‌شده)</h2>';
 if(!P.length)h+='<div class="empty">درخواست تکمیل‌شده‌ای برای ارسال نیست.</div>';
 else h+=P.map(function(r){return '<div style="padding:10px 0;border-bottom:1px solid var(--ln)"><b>'+esc(r.name)+'</b> <span class="tag">'+esc(r.type)+'</span><div class="hint">منشی: '+esc(name(r.by))+(r.phone?' — تلفن: '+esc(r.phone):'')+'</div><div style="margin:6px 0">'+(r.addr?'📍 '+esc(r.addr)+(r.zip?'<br>کد پستی: '+esc(r.zip):''):'<span class="no">آدرس ثبت نشده</span>')+'</div><button class="sm s" onclick="setAddr(\''+r.by+'\','+r.id+')">'+(r.addr?'ویرایش آدرس':'ثبت آدرس')+'</button> <button class="sm" onclick="doShip(\''+r.by+'\','+r.id+')">ارسال شد</button></div>'}).join("");
 h+='</div>';
 if(D.length)h+='<div class="card"><h2>ارسال‌شده</h2><div class="tw"><table><tr><th>متقاضی</th><th>نوع</th><th>آدرس</th><th>تاریخ ارسال</th><th>کد رهگیری</th><th>اطلاع منشی</th></tr>'+D.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td><span class="tag">'+esc(r.type)+'</span></td><td style="white-space:normal">'+esc(r.addr)+'</td><td>'+fa(r.ship)+'</td><td>'+esc(r.track||"—")+'</td><td>'+(r.nseen?'<span class="yes">دیده شد ✓</span>':'<span class="hint">هنوز ندیده</span>')+'</td></tr>'}).join("")+'</table></div></div>';
 return h}
function doShip(u,id){var t=prompt("کد رهگیری (اختیاری):");if(t===null)return;mut(u,function(){var r=F(S.reqs,id);r.ship=today();r.track=t.trim();r.nf=1;r.nseen=0}).then(function(){alert("به منشی اطلاع داده شد.")})}
function setAddr(u,id){var r=F(S.reqs,id),a=prompt("آدرس:",r.addr||"");if(a===null)return;var z=prompt("کد پستی (اختیاری):",r.zip||"");mut(u,function(){var q=F(S.reqs,id);q.addr=a.trim();if(z!==null)q.zip=z.trim()})}
function repsH(){var L=S.reps.slice().sort(function(a,b){return a.date<b.date?1:-1});
 if(!L.length)return'<div class="card"><div class="empty">گزارشی ثبت نشده است.</div></div>';
 return'<div class="card"><h2>گزارش‌های روزانه</h2><div class="tw"><table><tr><th>تاریخ</th><th>منشی</th><th>فروش</th><th>هدف فردا</th><th>برنامه فردا</th></tr>'+L.map(function(r){return'<tr><td>'+fa(r.date)+'</td><td>'+esc(name(r.by))+'</td><td>'+money(r.sale)+'</td><td>'+money(r.target)+'</td><td style="white-space:normal">'+esc(r.plan)+'</td></tr>'}).join("")+'</table></div></div>'}
function teamH(){return'<div class="card"><h2>اعضای تیم</h2><div class="tw"><table><tr><th>نام</th><th>نام کاربری</th><th>رمز</th><th>وضعیت</th><th></th></tr>'+S.users.filter(function(u){return u.role=="m"}).map(function(u){return'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.u)+'</td><td>'+esc(u.p)+'</td><td>'+(u.on?'<span class="yes">فعال</span>':'<span class="no">غیرفعال</span>')+'</td><td><button class="sm s" onclick="tgl(\''+u.u+'\')">'+(u.on?"غیرفعال":"فعال")+'</button> <button class="sm s" onclick="rst(\''+u.u+'\')">رمز جدید</button></td></tr>'}).join("")+'</table></div></div><div class="card"><h2>افزودن عضو</h2><div class="g"><div><label>نام کامل</label><input id="nn"></div><div><label>نام کاربری</label><input id="nu" autocapitalize="off"></div><div><label>رمز</label><input id="np"></div></div><div style="margin-top:14px"><button onclick="addU()">افزودن</button></div></div>'}
function tgl(u){muU(function(){var x=S.users.filter(function(a){return a.u==u})[0];x.on=x.on?0:1})}
function rst(u){var p=prompt("رمز جدید:");if(p)muU(function(){S.users.filter(function(a){return a.u==u})[0].p=p})}
function addU(){var n=$("nn").value.trim(),u=$("nu").value.trim(),p=$("np").value;if(!n||!u||!p){alert("همه فیلدها لازم است.");return}
 if(S.users.some(function(a){return a.u.toLowerCase()==u.toLowerCase()})){alert("این نام کاربری وجود دارد.");return}
 muU(function(){S.users.push({u:u,p:p,name:n,role:"m",on:1})})}

boot();
</script>
</body>
</html>
